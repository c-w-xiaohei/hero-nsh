name: Release

# Version PR first, npm after it merges: `changesets/action` opens or updates
# the PR while changesets are pending, and publishes when none remain.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm reads the token from ~/.npmrc; provenance uses the OIDC token.
      - name: npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # The action looks for the token in its own environment; the
          # ~/.npmrc above is not enough, and without this it falls back to
          # OIDC trusted publishing, which cannot create a new package.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
