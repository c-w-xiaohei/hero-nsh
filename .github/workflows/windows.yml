name: Windows

# Every test file in Win32 windows with the platform's own input, but the
# `.headless.` ones (the headless engine's drag/hold and key press) and the
# `.web.` ones (Tab focus movement, which NSH 0.4.0 does not do on Windows).
#
# One file at a time: two runs on one machine would fight over the focus the
# cases assert. Two runners, so the list splits in half instead.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "harness/**"
      - "scenarios/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".nvmrc"
      - ".github/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests
        shell: bash
        run: |
          files=($(find harness/tests \( -name '*.test.tsx' -o -name '*.test.ts' \) \
            ! -name '*.headless.test.*' ! -name '*.web.test.*' ! -name '*.browser.test.*' \
            | sort))
          for ((i = ${{ matrix.shard }}; i < ${#files[@]}; i += 2)); do
            nsh test "${files[$i]}" --target windows
          done
