name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

jobs:
  test:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'windows')
    runs-on: windows-latest
    env:
      NSH_VERSION: v0.4.0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install nsh
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: pnpm install --frozen-lockfile
      - run: nsh test harness --target windows --junit junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-windows
          path: junit.xml
          if-no-files-found: ignore
