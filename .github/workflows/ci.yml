name: CI

# Types, the headless engine, a browser, Win32 and the packed tarball.
#
# Every test job takes one third of its file list, and three runners run those
# thirds at once: `nsh test` takes a single path, so the file is the parallel
# unit. On one machine a job runs four files at once (headless), two (web) or
# one (Windows, where a second run would take the focus the cases assert).
#
# What runs where is the file name: `.headless.` needs the headless engine,
# `.web.` needs a browser, `.windows.` needs Win32, everything else runs on the
# headless engine and on Windows.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "harness/**"
      - "scenarios/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".nvmrc"
      - ".github/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check

  headless:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests
        run: |
          find harness/tests \( -name '*.test.tsx' -o -name '*.test.ts' \) \
            ! -name '*.web.test.*' ! -name '*.browser.test.*' ! -name '*.windows.test.*' \
            | sort | awk -v s='${{ matrix.shard }}' 'NR % 3 == s' \
            | xargs -r -n1 -P4 nsh test

  web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests
        run: |
          find harness/tests -name '*.web.test.tsx' \
            | sort | awk -v s='${{ matrix.shard }}' 'NR % 3 == s' \
            | xargs -r -n1 -P2 nsh test --target web

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests
        shell: bash
        run: |
          files=($(find harness/tests \( -name '*.test.tsx' -o -name '*.test.ts' \) \
            ! -name '*.headless.test.*' ! -name '*.web.test.*' ! -name '*.browser.test.*' \
            | sort))
          for ((i = ${{ matrix.shard }}; i < ${#files[@]}; i += 3)); do
            nsh test "${files[$i]}" --target windows
          done

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Pack and consume
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          printf '{"name":"consumer","version":"0.0.0","private":true}\n' > package.json
          pnpm add "$RUNNER_TEMP"/hero-nsh-*.tgz
          printf '{"name":"consumer","id":"com.heronsh.consumer","version":"0.0.0","build":1}\n' > nsh.json
          printf '{"extends":"./.nsh/tsconfig.json","include":["**/*.ts","**/*.tsx"]}\n' > tsconfig.json
          cat > App.tsx <<'TSX'
          import { mount, Text } from "nsh";
          import { Button, Card, HERO_NSH_VERSION } from "hero-nsh";

          mount(() => (
            <Card className="p-4">
              <Button>Save</Button>
              <Text>{HERO_NSH_VERSION}</Text>
            </Card>
          ));
          TSX
          nsh check .
          echo 'expect(app.texts()).toContain("0.0.0");' | nsh test App.tsx
