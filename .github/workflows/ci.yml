name: CI

# .github/scripts/test.sh maps test suffixes to targets. Native targets run
# one file at a time because the tests share a windowing host or device.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "harness/**"
      - "scenarios/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".nvmrc"
      - ".github/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The toolchain the library is written against; `install.sh` reads it and
# defaults to the latest release, whose generated `nsh` declarations change
# between versions.
env:
  NSH_VERSION: v0.6.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check

  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          bash .github/scripts/test.sh headless 2>&1 | tee "$RUNNER_TEMP/tests.log"
          # An unknown class builds, passes and renders wrong; the warning is
          # the only signal. The tests run with no "tailwind" block in
          # harness/nsh.json, so a class that needs one shows up here.
          if grep -q 'unknown class' "$RUNNER_TEMP/tests.log"; then
            echo "::error::A test run logged an unknown class warning"
            exit 1
          fi

  web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Web runtime
        run: nsh component add web
      - name: Tests
        run: bash .github/scripts/test.sh web ${{ matrix.shard }} ${{ strategy.job-total }}

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Tests
        shell: bash
        run: bash .github/scripts/test.sh windows ${{ matrix.shard }} ${{ strategy.job-total }}

  native-tests:
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.tests.outputs.ios }}
      android: ${{ steps.tests.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - id: tests
        name: Discover native mobile tests
        shell: bash
        run: |
          for target in ios android; do
            files=$(bash .github/scripts/test.sh --list "$target")
            if [[ -n "$files" ]]; then
              echo "$target=true" >> "$GITHUB_OUTPUT"
            else
              echo "$target=false" >> "$GITHUB_OUTPUT"
            fi
          done

  ios:
    needs: native-tests
    if: needs.native-tests.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: iOS tests
        run: bash .github/scripts/test.sh ios

  android:
    needs: native-tests
    if: needs.native-tests.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Android runtime
        run: nsh component add android
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::Android emulator requires a runner with writable /dev/kvm'
            exit 1
          fi
      - name: Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: 'false'
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/test.sh android
      - name: Android emulator crash data
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-crash-data
          path: /tmp/android-runner/emu-crash-*
          if-no-files-found: ignore
          retention-days: 7

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Pack and consume
        run: |
          set -o pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          printf '{"name":"consumer","version":"0.0.0","private":true}\n' > package.json
          pnpm add "$RUNNER_TEMP"/hero-nsh-*.tgz
          # The documented setup and nothing more: the theme file the package
          # ships, and no "tailwind" block. Geometry (radius, shadows, easing)
          # has to come from the package itself.
          printf '{"name":"consumer","id":"com.heronsh.consumer","version":"0.0.0","build":1,"theme":"node_modules/hero-nsh/theme/hero-nsh.theme.json"}\n' > nsh.json
          printf '{"extends":"./.nsh/tsconfig.json","include":["**/*.ts","**/*.tsx"]}\n' > tsconfig.json
          cat > App.tsx <<'TSX'
          import { mount } from "nsh";
          import { Button, Card, Input, Label, TextField } from "hero-nsh";

          mount(() => (
            <Card className="p-4">
              <TextField>
                <Label>Email</Label>
                <Input placeholder="you@example.com" />
              </TextField>
              <Button>Save</Button>
            </Card>
          ));
          TSX
          nsh check . 2>&1 | tee "$RUNNER_TEMP/consumer-check.log"
          echo 'expect(app.texts()).toContain("Save");' | nsh test App.tsx 2>&1 | tee "$RUNNER_TEMP/consumer-test.log"
          # An unknown class builds, passes and renders wrong, so the only signal
          # is the warning: read the logs for it.
          if grep -qE 'unknown class' "$RUNNER_TEMP"/consumer-*.log; then
            echo "::error::A consumer with only the shipped theme file got an unknown class warning"
            exit 1
          fi
